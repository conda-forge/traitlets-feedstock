# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.15.0"
  python_check_max: "3.14"

package:
  name: traitlets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/traitlets/traitlets-${{ version }}.tar.gz
  sha256: 4fead733f81cf1c4c938e06f8ca4633896833c9d89eff878159457f4d4392971

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling >=1.5
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - traitlets
        - traitlets.config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - argcomplete >=3.0.3
        - coverage
        - pip
        - pytest >=7.0,<8.2
        - pytest-mock
        - pytest-mypy-testing
        - python ${{ python_min }}
    script:
      - coverage run --source=traitlets --parallel --branch -m pytest -vv
      - coverage run --source=traitlets --parallel --branch -m pytest -vv --pyargs traitlets
      - coverage combine
      - coverage report --show-missing --skip-covered --fail-under=80

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Configuration system for Python applications
  homepage: https://pypi.org/project/traitlets
  repository: https://github.com/ipython/traitlets
  documentation: https://traitlets.readthedocs.org

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - minrk
    - SylvainCorlay
    - ocefpaf
    - Carreau
    - takluyver
    - rmorshea
    - blink1073
    - zsailer
    - bollwyvl
    - davidbrochart
